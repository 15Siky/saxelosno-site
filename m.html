<main class="doc">

    <h1>ხელოსანი სახელოსნოში</h1>
    <p class="muted">ნახეთ პროფილი, სამუშაო საათები და შეფასებები, მისწერეთ ან დაურეკეთ.</p>

  <a id="open" class="button primary" href="saxelosno://">აპლიკაციაში გახსნა</a>
  <a class="button secondary" href="https://play.google.com/store/apps/details?id=com.saxelosno.app">Google Play-დან ჩამოტვირთვა</a>

</main>
<script>
  // The link carries the mechanic's id: ?id=<uuid>. Only a real id is used.
  var id = new URLSearchParams(location.search).get('id') || '';
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
    var deepLink = 'saxelosno://owner/mechanic/' + id;
    document.getElementById('open').href = deepLink;
    // Try the app straight away; if it isn't installed, the page simply stays.
    location.href = deepLink;
  }
</script>
